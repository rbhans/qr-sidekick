name: qr_sidekick
description: "QR Sidekick - HVAC technician tool for Niagara equipment data via QR codes"
publish_to: 'none'
version: 1.0.0+3

environment:
  sdk: ^3.10.1

dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.8

  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Backend
  supabase_flutter: ^2.8.4

  # Navigation
  go_router: ^14.8.1

  # QR Code
  mobile_scanner: ^6.0.5
  qr_flutter: ^4.1.0

  # Storage
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.3.5

  # Networking
  http: ^1.3.0
  connectivity_plus: ^6.1.4

  # Environment
  flutter_dotenv: ^5.2.1

  # Utilities
  html: ^0.15.5
  collection: ^1.19.1
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  share_plus: ^10.1.4
  printing: ^5.14.2
  pdf: ^3.11.3
  uuid: ^4.5.1
  intl: ^0.20.2
  url_launcher: ^6.3.1
  purchases_flutter: ^9.10.4

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Linting
  flutter_lints: ^6.0.0

  # Code generation
  riverpod_generator: ^2.6.4
  build_runner: ^2.4.15
  freezed: ^2.5.8
  json_serializable: ^6.9.4

  # Testing
  mocktail: ^1.0.4

flutter:
  uses-material-design: true

  assets:
    - .env  # Add .env to assets locally for development; do not commit real credentials
